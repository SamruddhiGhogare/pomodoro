<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="timer-container">
            <div class="timer-display">
                <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
            <div class="timer-controls">
                <button id="startBtn" class="btn">
                    <i class="fas fa-play"></i>
                </button>
                <button id="pauseBtn" class="btn" disabled>
                    <i class="fas fa-pause"></i>
                </button>
                <button id="resetBtn" class="btn">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            <div class="timer-modes">
                <button class="mode-btn active" data-time="25">Pomodoro</button>
                <button class="mode-btn" data-time="5">Short Break</button>
                <button class="mode-btn" data-time="15">Long Break</button>
            </div>
        </div>
        <div class="task-container">
            <h2>Tasks</h2>
            <div class="task-input">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addTaskBtn" class="btn">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
